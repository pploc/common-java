plugins {
    id 'java-library'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'jacoco'
    id 'maven-publish'
}

group = 'com.gym'

version = System.getenv('RELEASE_VERSION') ?: '2.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 26
}

bootJar {
    enabled = false
}

jar {
    enabled = true
}

repositories {
    mavenCentral()

    exclusiveContent {
        forRepository {
            maven {
                url 'https://maven.pkg.github.com/pploc/gym-proto'
                credentials {
                    username = System.getenv("GITHUB_ACTOR") ?: project.findProperty("gpr.user") ?: "pploc"
                    password = System.getenv("GITHUB_TOKEN") ?: project.findProperty("gpr.key")
                }
            }
        }
        filter {
            includeModule('com.gym.proto', 'gym-proto-java')
        }
    }

    maven {
        url 'https://packages.confluent.io/maven/'
    }
}

publishing {
    publications {
        gpr(MavenPublication) {
            from components.java
            pom {
                name = 'common-java'
                description = 'Shared Java foundations for Gym microservices.'
                url = 'https://github.com/pploc/common-java'
                scm {
                    url = 'https://github.com/pploc/common-java'
                    connection = 'scm:git:https://github.com/pploc/common-java.git'
                    developerConnection = 'scm:git:ssh://git@github.com/pploc/common-java.git'
                }
            }
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/pploc/common-java")
            credentials {
                username = System.getenv("GITHUB_ACTOR") ?: project.findProperty("gpr.user") ?: "pploc"
                password = System.getenv("GITHUB_TOKEN") ?: project.findProperty("gpr.key")
            }
        }
    }
}

configurations.configureEach {
    resolutionStrategy {
        // Confluent 8 protobuf provider needs GeneratedFile (protobuf-java ≥ 4.33).
        // Confluent 7.x is GeneratedMessageV3-era and VerifyError's on protobuf 4.
        force 'com.google.protobuf:protobuf-java:4.33.5'
        force 'com.google.protobuf:protobuf-java-util:4.33.5'
    }
}

dependencies {
    api platform('org.springframework.boot:spring-boot-dependencies:4.1.0')

    api 'org.springframework.boot:spring-boot-starter'
    api 'org.springframework.kafka:spring-kafka'
    api('io.confluent:kafka-protobuf-serializer:8.0.7') {
        exclude group: 'com.google.protobuf', module: 'protobuf-java'
        exclude group: 'com.google.protobuf', module: 'protobuf-java-util'
    }

    api 'io.grpc:grpc-netty-shaded:1.68.0'
    api 'io.grpc:grpc-core:1.68.0'
    api 'io.grpc:grpc-api:1.68.0'
    api 'io.grpc:grpc-protobuf:1.68.0'
    api 'io.grpc:grpc-stub:1.68.0'
    api 'io.grpc:grpc-services:1.68.0'
    api 'com.google.protobuf:protobuf-java:4.33.5'
    api 'com.google.protobuf:protobuf-java-util:4.33.5'
    api 'com.google.api.grpc:proto-google-common-protos:2.22.1'

    api 'com.gym.proto:gym-proto-java:4.1.0'
    api 'build.buf:protovalidate:0.6.0'

    api 'io.opentelemetry:opentelemetry-api:1.43.0'
    api 'io.micrometer:micrometer-core'
    api 'io.micrometer:micrometer-registry-prometheus'

    compileOnly 'jakarta.persistence:jakarta.persistence-api:3.2.0'
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.1.0'
    compileOnly 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.springframework.boot:spring-boot-starter-validation'
    compileOnly 'org.springframework.boot:spring-boot-starter-security'
    api 'com.fasterxml.jackson.core:jackson-databind'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'jakarta.persistence:jakarta.persistence-api:3.2.0'
    testImplementation 'jakarta.servlet:jakarta.servlet-api:6.1.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation'
    testImplementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'io.grpc:grpc-testing:1.68.0'
}

jacoco {
    toolVersion = "0.8.14"
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags('kafka-contract')
    }
    failOnNoDiscoveredTests = false
}

tasks.register('verifyNoLegacyKafkaTransport') {
    group = 'verification'
    description = 'Rejects the removed JSON-envelope Kafka transport symbols.'
    doLast {
        def forbidden = [
                /\bEventEnvelope\b/,
                /\bEventEnvelopeSerializer\b/,
                /\bEventEnvelopeDeserializer\b/,
                /\bEventConsumer\b/,
                /\bRetryableConsumer\b/
        ]
        def matches = fileTree('src/main').matching { include '**/*.java' }.files.findAll { file ->
            forbidden.any { pattern -> file.text =~ pattern }
        }
        if (!matches.isEmpty()) {
            throw new GradleException("Removed legacy Kafka symbols found in: ${matches*.path.join(', ')}")
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyNoLegacyKafkaTransport')
}

tasks.register('kafkaContractIntegration', Test) {
    description = 'Runs live Kafka and Schema Registry contract tests.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter(tasks.named('test'))
    outputs.upToDateWhen { false }
    useJUnitPlatform {
        includeTags('kafka-contract')
        excludeTags('foundation-matrix')
    }
    reports.junitXml.outputLocation = layout.buildDirectory.dir('test-results/kafkaContractIntegration')
    reports.html.outputLocation = layout.buildDirectory.dir('reports/tests/kafkaContractIntegration')
}

tasks.register('foundationMatrixProduce', Test) {
    description = 'Publishes Java records for the cross-language foundation matrix.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    outputs.upToDateWhen { false }
    useJUnitPlatform {
        includeTags('foundation-matrix-produce')
    }
    reports.junitXml.outputLocation = layout.buildDirectory.dir('test-results/foundationMatrixProduce')
}

tasks.register('foundationMatrixConsume', Test) {
    description = 'Consumes Go records for the cross-language foundation matrix.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    outputs.upToDateWhen { false }
    useJUnitPlatform {
        includeTags('foundation-matrix-consume')
    }
    reports.junitXml.outputLocation = layout.buildDirectory.dir('test-results/foundationMatrixConsume')
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                // Contract behavior is covered by focused unit and broker integration suites.
                minimum = 0.83
            }
        }
    }
}
