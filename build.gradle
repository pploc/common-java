plugins {
    id 'java-library'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'jacoco'
    id 'maven-publish'
}

group = 'com.gym'

if (System.getenv('RELEASE_VERSION')) {
    version = System.getenv('RELEASE_VERSION')
} else if (project.version == 'unspecified') {
    def versionFile = file('version.properties')
    def versionProps = new Properties()
    if (versionFile.exists()) {
        versionFile.withInputStream { versionProps.load(it) }
    }
    def major = versionProps['major'] ?: '1'
    def minor = versionProps['minor'] ?: '0'
    def patch = versionProps['patch'] ?: '0'
    version = "${major}.${minor}.${patch}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 26
}

bootJar {
    enabled = false
}

jar {
    enabled = true
}

repositories {
    if (providers.gradleProperty('useMavenLocal').isPresent()) {
        mavenLocal()
    }
    mavenCentral()

    exclusiveContent {
        forRepository {
            maven {
                url 'https://maven.pkg.github.com/pploc/gym-proto'
                credentials {
                    username = System.getenv("GITHUB_ACTOR") ?: project.findProperty("gpr.user") ?: "pploc"
                    password = System.getenv("GITHUB_TOKEN") ?: project.findProperty("gpr.key")
                }
            }
        }
        filter {
            includeModule('com.gym.proto', 'gym-proto-java')
        }
    }

    maven {
        url 'https://packages.confluent.io/maven/'
    }
}

publishing {
    publications {
        gpr(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/pploc/common-java")
            credentials {
                username = System.getenv("GITHUB_ACTOR") ?: project.findProperty("gpr.user") ?: "pploc"
                password = System.getenv("GITHUB_TOKEN") ?: project.findProperty("gpr.key")
            }
        }
    }
}

dependencies {
    api platform('org.springframework.boot:spring-boot-dependencies:4.1.0')

    api 'org.springframework.boot:spring-boot-starter'
    api 'org.springframework.kafka:spring-kafka'
    api 'io.confluent:kafka-protobuf-serializer:7.7.1'

    api 'io.grpc:grpc-netty-shaded:1.68.0'
    api 'io.grpc:grpc-core:1.68.0'
    api 'io.grpc:grpc-api:1.68.0'
    api 'io.grpc:grpc-protobuf:1.68.0'
    api 'io.grpc:grpc-stub:1.68.0'
    api 'io.grpc:grpc-services:1.68.0'
    api 'com.google.protobuf:protobuf-java:3.25.4'
    api 'com.google.protobuf:protobuf-java-util:3.25.4'
    api 'com.google.api.grpc:proto-google-common-protos:2.22.1'

    api 'com.gym.proto:gym-proto-java:1.1.0'

    api 'io.opentelemetry:opentelemetry-api:1.43.0'
    api 'io.micrometer:micrometer-core'
    api 'io.micrometer:micrometer-registry-prometheus'

    compileOnly 'jakarta.persistence:jakarta.persistence-api:3.2.0'
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.1.0'
    compileOnly 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.springframework.boot:spring-boot-starter-validation'
    compileOnly 'org.springframework.boot:spring-boot-starter-security'
    api 'com.fasterxml.jackson.core:jackson-databind'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'jakarta.persistence:jakarta.persistence-api:3.2.0'
    testImplementation 'jakarta.servlet:jakarta.servlet-api:6.1.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation'
    testImplementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'io.grpc:grpc-testing:1.68.0'
    testImplementation 'io.grpc:grpc-inprocess:1.68.0'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.1'
    testImplementation 'org.testcontainers:postgresql:1.20.1'
    testImplementation 'org.testcontainers:kafka:1.20.1'
    testImplementation 'org.testcontainers:testcontainers:1.20.1'
}

jacoco {
    toolVersion = "0.8.14"
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags('kafka-contract')
    }
    failOnNoDiscoveredTests = false
}

tasks.register('kafkaContractIntegration', Test) {
    description = 'Runs live Kafka and Schema Registry contract tests.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter(tasks.named('test'))
    outputs.upToDateWhen { false }
    useJUnitPlatform {
        includeTags('kafka-contract')
    }
    reports.junitXml.outputLocation = layout.buildDirectory.dir('test-results/kafkaContractIntegration')
    reports.html.outputLocation = layout.buildDirectory.dir('reports/tests/kafkaContractIntegration')
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                // Contract behavior is covered by focused unit and broker integration suites.
                minimum = 0.83
            }
        }
    }
}
