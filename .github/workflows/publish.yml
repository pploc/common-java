name: Validate and Publish Package

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
    tags: ["v*"]

permissions:
  contents: read
  packages: read

env:
  GITHUB_ACTOR: ${{ github.actor }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'corretto'
      - name: Validate Java foundation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew clean check jacocoTestCoverageVerification --no-daemon

  publish:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'corretto'
      - name: Validate tag-derived version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF#refs/tags/v}"
          test -n "$version"
          test "$(git tag --points-at HEAD | grep -Fx "v$version")" = "v$version"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Validate and publish immutable package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew clean check jacocoTestCoverageVerification --no-daemon
          ./gradlew publish -Pversion="$RELEASE_VERSION" --no-daemon
      - name: Write provenance evidence
        shell: bash
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-sha.txt
          sha256sum build/libs/*.jar > evidence/artifacts.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: common-java-release-evidence-${{ github.sha }}
          path: evidence/
